<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img"><title>BCM2837B0 block diagram</title><desc>Known blocks of the Raspberry Pi 3B+ chip: ARM subsystem, VideoCore IV, system bus and SDRAM controller, peripherals, display and camera interfaces, and the chips next to it on the board.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-size:13px;font-weight:600;fill:#2C2C2A}.ts{font-size:11px}
.frame{stroke:#888780}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal text{fill:#085041}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
.box rect{fill:#FFFFFF;stroke:#5F5E5A}
@media (prefers-color-scheme:dark){
text{fill:#B4B2A9}.th{fill:#F1EFE8}.frame{stroke:#B4B2A9}
.c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple text{fill:#EEEDFE}
.c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal text{fill:#E1F5EE}
.c-gray rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray text{fill:#F1EFE8}
.box rect{fill:#2C2C2A;stroke:#B4B2A9}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="30" width="600" height="104" rx="16" fill="none" class="frame" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="58" y="52">ARM subsystem (1.4 GHz)</text>
<g class="c-purple"><rect x="60" y="66" width="170" height="52" rx="8" stroke-width="0.5"/><text class="th" x="145" y="84" text-anchor="middle" dominant-baseline="central">4x Cortex-A53</text><text class="ts" x="145" y="104" text-anchor="middle" dominant-baseline="central">AArch64, ARMv8</text></g>
<g class="c-purple"><rect x="250" y="66" width="170" height="52" rx="8" stroke-width="0.5"/><text class="th" x="335" y="84" text-anchor="middle" dominant-baseline="central">L2 cache 512 KB</text><text class="ts" x="335" y="104" text-anchor="middle" dominant-baseline="central">shared by 4 cores</text></g>
<g class="c-purple"><rect x="440" y="66" width="170" height="52" rx="8" stroke-width="0.5"/><text class="th" x="525" y="84" text-anchor="middle" dominant-baseline="central">Local peripherals</text><text class="ts" x="525" y="104" text-anchor="middle" dominant-baseline="central">timers, core mailboxes</text></g>
<rect x="40" y="150" width="600" height="160" rx="16" fill="none" class="frame" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="58" y="172">VideoCore IV (starts first)</text>
<g class="c-teal"><rect x="58" y="184" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="200" text-anchor="middle" dominant-baseline="central">VPU x2</text><text class="ts" x="120" y="218" text-anchor="middle" dominant-baseline="central">scalar + vector</text></g>
<g class="c-teal"><rect x="201" y="184" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="263" y="200" text-anchor="middle" dominant-baseline="central">L2 128 KB</text><text class="ts" x="263" y="218" text-anchor="middle" dominant-baseline="central">bootcode runs</text></g>
<g class="c-teal"><rect x="344" y="184" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="406" y="200" text-anchor="middle" dominant-baseline="central">Boot ROM</text><text class="ts" x="406" y="218" text-anchor="middle" dominant-baseline="central">first stage</text></g>
<g class="c-teal"><rect x="487" y="184" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="549" y="200" text-anchor="middle" dominant-baseline="central">OTP</text><text class="ts" x="549" y="218" text-anchor="middle" dominant-baseline="central">fuses, serial</text></g>
<g class="c-teal"><rect x="58" y="246" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="262" text-anchor="middle" dominant-baseline="central">V3D</text><text class="ts" x="120" y="280" text-anchor="middle" dominant-baseline="central">12 QPUs, 3D</text></g>
<g class="c-teal"><rect x="201" y="246" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="263" y="262" text-anchor="middle" dominant-baseline="central">HVS</text><text class="ts" x="263" y="280" text-anchor="middle" dominant-baseline="central">compositor</text></g>
<g class="c-teal"><rect x="344" y="246" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="406" y="262" text-anchor="middle" dominant-baseline="central">PixelValve x3</text><text class="ts" x="406" y="280" text-anchor="middle" dominant-baseline="central">display timing</text></g>
<g class="c-teal"><rect x="487" y="246" width="125" height="48" rx="8" stroke-width="0.5"/><text class="th" x="549" y="262" text-anchor="middle" dominant-baseline="central">ISP + codecs</text><text class="ts" x="549" y="280" text-anchor="middle" dominant-baseline="central">camera, H.264</text></g>
<g class="box"><rect x="40" y="328" width="410" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="245" y="350" text-anchor="middle" dominant-baseline="central">System bus (AXI, VPU bus)</text>
<g class="box"><rect x="470" y="328" width="170" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="555" y="350" text-anchor="middle" dominant-baseline="central">SDRAM controller</text>
<rect x="40" y="392" width="600" height="228" rx="16" fill="none" class="frame" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="58" y="414">Peripherals (bus 0x7E000000)</text>
<g class="c-gray">
<rect x="60" y="428" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="175" y="428" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="290" y="428" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="405" y="428" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="520" y="428" width="100" height="36" rx="6" stroke-width="0.5"/>
<rect x="60" y="474" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="175" y="474" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="290" y="474" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="405" y="474" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="520" y="474" width="100" height="36" rx="6" stroke-width="0.5"/>
<rect x="60" y="520" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="175" y="520" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="290" y="520" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="405" y="520" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="520" y="520" width="100" height="36" rx="6" stroke-width="0.5"/>
<rect x="60" y="566" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="175" y="566" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="290" y="566" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="405" y="566" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="520" y="566" width="100" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="110" y="446" text-anchor="middle" dominant-baseline="central">GPIO x54</text><text class="ts" x="225" y="446" text-anchor="middle" dominant-baseline="central">UART0 PL011</text><text class="ts" x="340" y="446" text-anchor="middle" dominant-baseline="central">Mini UART</text><text class="ts" x="455" y="446" text-anchor="middle" dominant-baseline="central">SPI x3</text><text class="ts" x="570" y="446" text-anchor="middle" dominant-baseline="central">I2C (BSC) x3</text>
<text class="ts" x="110" y="492" text-anchor="middle" dominant-baseline="central">PWM x2</text><text class="ts" x="225" y="492" text-anchor="middle" dominant-baseline="central">PCM / I2S</text><text class="ts" x="340" y="492" text-anchor="middle" dominant-baseline="central">SDHOST</text><text class="ts" x="455" y="492" text-anchor="middle" dominant-baseline="central">EMMC SDHCI</text><text class="ts" x="570" y="492" text-anchor="middle" dominant-baseline="central">USB DWC2</text>
<text class="ts" x="110" y="538" text-anchor="middle" dominant-baseline="central">DMA x16</text><text class="ts" x="225" y="538" text-anchor="middle" dominant-baseline="central">System timer</text><text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">IRQ control</text><text class="ts" x="455" y="538" text-anchor="middle" dominant-baseline="central">Mailbox</text><text class="ts" x="570" y="538" text-anchor="middle" dominant-baseline="central">PM, watchdog</text>
<text class="ts" x="110" y="584" text-anchor="middle" dominant-baseline="central">Clocks</text><text class="ts" x="225" y="584" text-anchor="middle" dominant-baseline="central">PLLs A-D, H</text><text class="ts" x="340" y="584" text-anchor="middle" dominant-baseline="central">RNG</text><text class="ts" x="455" y="584" text-anchor="middle" dominant-baseline="central">Temp sensor</text><text class="ts" x="570" y="584" text-anchor="middle" dominant-baseline="central">SMI</text>
</g>
<rect x="40" y="640" width="600" height="88" rx="16" fill="none" class="frame" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="58" y="662">Display and camera ports</text>
<g class="c-teal">
<rect x="60" y="676" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="175" y="676" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="290" y="676" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="405" y="676" width="100" height="36" rx="6" stroke-width="0.5"/><rect x="520" y="676" width="100" height="36" rx="6" stroke-width="0.5"/>
<text class="ts" x="110" y="694" text-anchor="middle" dominant-baseline="central">HDMI</text><text class="ts" x="225" y="694" text-anchor="middle" dominant-baseline="central">DSI x2</text><text class="ts" x="340" y="694" text-anchor="middle" dominant-baseline="central">DPI</text><text class="ts" x="455" y="694" text-anchor="middle" dominant-baseline="central">VEC (TV out)</text><text class="ts" x="570" y="694" text-anchor="middle" dominant-baseline="central">CSI-2 x2</text>
</g>
<rect x="40" y="748" width="600" height="104" rx="16" fill="none" class="frame" stroke-width="0.5" stroke-dasharray="2 4"/>
<text class="th" x="58" y="770">On the board, outside the chip (3B+)</text>
<g class="box"><rect x="58" y="784" width="125" height="48" rx="8" stroke-width="0.5"/></g><text class="th" x="120" y="800" text-anchor="middle" dominant-baseline="central">LPDDR2</text><text class="ts" x="120" y="818" text-anchor="middle" dominant-baseline="central">1 GB</text>
<g class="box"><rect x="201" y="784" width="125" height="48" rx="8" stroke-width="0.5"/></g><text class="th" x="263" y="800" text-anchor="middle" dominant-baseline="central">LAN7515</text><text class="ts" x="263" y="818" text-anchor="middle" dominant-baseline="central">USB hub + GbE</text>
<g class="box"><rect x="344" y="784" width="125" height="48" rx="8" stroke-width="0.5"/></g><text class="th" x="406" y="800" text-anchor="middle" dominant-baseline="central">CYW43455</text><text class="ts" x="406" y="818" text-anchor="middle" dominant-baseline="central">Wi-Fi + BT</text>
<g class="box"><rect x="487" y="784" width="125" height="48" rx="8" stroke-width="0.5"/></g><text class="th" x="549" y="800" text-anchor="middle" dominant-baseline="central">MxL7704</text><text class="ts" x="549" y="818" text-anchor="middle" dominant-baseline="central">power (PMIC)</text>
<rect class="c-purple" x="58" y="870" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="80" y="877" dominant-baseline="central">ARM side</text>
<rect class="c-teal" x="160" y="870" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="182" y="877" dominant-baseline="central">VideoCore side</text>
<rect class="c-gray" x="300" y="870" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="322" y="877" dominant-baseline="central">shared peripherals</text>
</svg>